[package]
name = "nenrin"
version = "0.0.0" # the app version comes from package.json (see tauri.conf.json)
description = "Local-first flashcards with FSRS spaced repetition."
license = "MIT"
repository = "https://github.com/parmsam/nenrin"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "nenrin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2"
